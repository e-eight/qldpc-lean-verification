[project]
name = "qldpc-lean-verification"
version = "0.1.0"
description = "Lean proofs and certificate experiments for qldpc-challenge codes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.17"]
search = ["pybind11>=2.13,<4", "setuptools>=75"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["pyproject.toml", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
